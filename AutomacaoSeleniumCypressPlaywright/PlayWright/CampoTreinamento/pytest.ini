[pytest]
pythonpath = .
testpaths = tests

addopts =
    -v
    -s
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --alluredir=allure-results
    --clean-alluredir

markers =
    order: define a ordem de execução dos testes

# Adicione --headed em addopts para executar os testes com o navegador visível.
# Em ambientes de CI (GitHub Actions), mantenha o modo headless (padrão).
# Execute "playwright install" uma vez na máquina local ou "python -m playwright install --with-deps"
# no pipeline para instalar os navegadores necessários.