[pytest]
pythonpath = .
testpaths = tests

addopts =
    -v
    -s
    -n auto
    --html=report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --alluredir=allure-results
    --clean-alluredir

markers =   order: define a ordem de execução dos testes

#Adicionar --headed no [addopts] se quiser abrir navegador, mas após rodar o comando {playwright install}, tal ação é necessário.
#-n auto ---> abre todos os navegadores de uma única vez (pip install pytest-xdist)
#--html=report.html ---> Gera um html com todas informações da execução (pip install pytest-html)
#--html=report.ht